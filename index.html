<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luz del Nazareno - Bienvenido</title>
    <style>
        /* Estilos Base para recrear el concepto */
        :root {
            --bg-color: #0a1128; /* Color de fondo oscuro */
            --card-bg: rgba(255, 255, 255, 0.03); /* Fondo de la tarjeta semi-transparente */
            --accent-color: #ffda79; /* Amarillo suave para la pastilla */
            --youtube-red: #ff0000;
            --text-color: #ffffff;
            --secondary-text: #d1d8e0;
        }

        body {
            background-color: var(--bg-color);
            /* IMPORTANTE: AQUÍ DEBES PONER EL NOMBRE DE TU IMAGEN SUBIDA */
            background-image: url('Jeesuus.jpg'); 
            background-size: cover; /* La imagen cubre todo el fondo */
            background-position: center; /* Centrada */
            background-repeat: no-repeat;
            color: var(--text-color);
            font-family: 'Montserrat', 'Segoe UI', sans-serif; /* Usamos una fuente más moderna */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            overflow: hidden; /* Evita scrolls innecesarios si la imagen es grande */
        }

        /* Capa oscura superpuesta a la imagen para legibilidad */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Oscurece la imagen de fondo */
            z-index: -1;
        }

        /* La Tarjeta Central del Diseño */
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px); /* Efecto de vidrio esmerilado */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; /* Esquinas muy redondeadas */
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7); /* Sombra profunda */
            position: relative; /* Para posicionar elementos internos */
            overflow: hidden; /* Asegura que nada se salga de las esquinas */
        }

        /* La "pastilla" amarilla superior */
        .pill-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(255, 218, 121, 0.1);
            color: var(--accent-color);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 218, 121, 0.2);
        }

        .pill-badge span {
            margin-right: 8px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--secondary-text);
            margin-bottom: 40px;
            line-height: 1.6;
            font-weight: 400;
        }

        /* El Botón Impactante (CTA) */
        .btn-youtube {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--youtube-red);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 18px 35px;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Animación suave */
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.5); /* Sombra roja brillante */
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-youtube:hover {
            background-color: #cc0000;
            transform: scale(1.03); /* Se agranda ligeramente */
            box-shadow: 0 15px 40px rgba(255, 0, 0, 0.7);
        }

        .btn-youtube svg {
            width: 28px;
            height: 28px;
            margin-right: 12px;
            fill: #ffffff;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Ajustes para Móviles */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            p.subtitle { font-size: 1.1rem; }
            .card { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Pastilla superior -->
        <div class="pill-badge">
            <span>✨</span> UN ESPACIO DE FE Y ESPERANZA
        </div>

        <!-- Título principal -->
        <h1>Encuentra Paz y Reflexión en Tu Día a Día</h1>

        <!-- Mensaje de bienvenida -->
        <p class="subtitle">
            Únete a nuestra comunidad en YouTube para compartir mensajes inspiradores, oraciones y la palabra que renueva tu fe.
        </p>

        <!-- Botón CTA -->
        <a href="https://www.youtube.com/@Luz_del_Nazareno?sub_confirmation=1" class="btn-youtube" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            ¡Suscríbete y Únete Ahora!
        </a>

        <div class="footer">
            <p>© Luz del Nazareno</p>
        </div>
    </div>

</body>
</html>
