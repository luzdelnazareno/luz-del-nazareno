<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luz del Nazareno - Un Camino de Fe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090e17 0%, #172a3a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .hero-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .content {
            padding: 30px 25px;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.3;
        }

        p.description {
            font-size: 1rem;
            color: #d1d8e0;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* Botón de YouTube interactivo */
        .btn-youtube {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #ff0000, #cc0000);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 16px 24px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
            cursor: pointer;
        }

        .btn-youtube:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.7);
            background: linear-gradient(45deg, #ff1a1a, #e60000);
        }

        .btn-youtube svg {
            width: 26px;
            height: 26px;
            margin-right: 10px;
            fill: #ffffff;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #8899a6;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Imagen representativa de Jesús -->
        <img class="hero-image" src="https://images.unsplash.com/photo-1544427920-c49ccfb85579?auto=format&fit=crop&w=800&q=80" alt="Jesús - Luz del Nazareno">

        <div class="content">
            <span class="badge">✨ UN ESPACIO DE FE Y ESPERANZA</span>
            
            <h1>Encuentra Paz y Reflexión en Tu Día a Día</h1>
            
            <p class="description">
                Únete a nuestra comunidad en YouTube para compartir mensajes inspiradores, oraciones y la palabra que renueva tu fe.
            </p>

            <!-- Botón principal de llamada a la acción -->
            <a href="https://www.youtube.com/@Luz_del_Nazareno?sub_confirmation=1" class="btn-youtube" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                ¡Suscríbete y Únete Ahora!
            </a>

            <div class="footer">
                <p>© Luz del Nazareno</p>
            </div>
        </div>
    </div>

</body>
</html>
