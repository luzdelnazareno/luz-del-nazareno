<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luz del Nazareno - Bienvenido</title>
    <style>
        /* Estilos Base */
        :root {
            --bg-color: #0a1128;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-color: #ffda79;
            --youtube-red: #ff0000;
            --text-color: #ffffff;
            --secondary-text: #d1d8e0;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('Jeesuus.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-color);
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }

        /* Capa oscura superpuesta a la imagen */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* La Tarjeta Central (Optimizada y más pequeña) */
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        /* La "pastilla" amarilla superior */
        .pill-badge {
            display: inline-flex;
            align-items: center;
            background-color: rgba(255, 218, 121, 0.1);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 218, 121, 0.2);
        }

        .pill-badge span {
            margin-right: 6px;
        }

        h1 {
            font-size: 2.1rem;
            margin-bottom: 12px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1rem;
            color: var(--secondary-text);
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 400;
        }

        /* El Botón Impactante (CTA) */
        .btn-youtube {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--youtube-red);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 24px;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-sizing: border-box;
        }

        .btn-youtube:hover {
            background-color: #cc0000;
            transform: scale(1.03);
            box-shadow: 0 12px 35px rgba(255, 0, 0, 0.7);
        }

        .btn-youtube svg {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Ajustes para Móviles */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            p.subtitle { font-size: 0.95rem; }
            .card { padding: 25px 18px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Pastilla superior -->
        <div class="pill-badge">
            <span>✨</span> JESÚS TIENE UN MENSAJE PARA TI
        </div>

        <!-- Título principal -->
        <h1>Ven a mí, hoy quiero renovar tu corazón</h1>

        <!-- Mensaje de bienvenida -->
        <p class="subtitle">
            Te invito a este espacio donde compartiremos mensajes de fe, oraciones y la paz que tanto necesitas. Suscríbete y caminemos juntos en mi palabra.
        </p>

        <!-- Botón CTA -->
        <a href="https://www.youtube.com/@Luz_del_Nazareno?sub_confirmation=1" class="btn-youtube" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            ¡Acepto tu invitación, Jesús!
        </a>

        <div class="footer">
            <p>© Luz del Nazareno</p>
        </div>
    </div>

</body>
</html>
